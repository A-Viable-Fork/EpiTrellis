name: verify

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Privacy runs first and alone. Nothing else matters if real capture
      # data has entered the tree, and git history is not deletable in practice.
      - name: privacy
        run: python3 scripts/verify-privacy.py

      - name: license
        run: python3 scripts/verify-license.py

      - name: functions
        run: python3 scripts/verify-functions.py

      - name: docs
        run: python3 scripts/verify-docs.py

      # The composition claim rests on the vendored bytes being unmodified, and
      # nothing else in this workflow would notice a tidy-up.
      - name: vendor
        run: python3 scripts/verify-vendor.py

      # Documents that describe the system, checked against the system.
      - name: selfdescription
        run: python3 scripts/verify-selfdescription.py

      # Two behaviours duplicated on purpose, pinned to fixtures so the copies
      # cannot drift apart silently.
      - name: parity
        run: python3 scripts/verify-parity.py
